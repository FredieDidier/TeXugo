# Installers for a new version. Runs when a tag like v0.2.0 is pushed: the
# tests first, then the Mac (Apple Silicon and Intel), Windows and Linux
# installers, attached to a draft release. The draft is published by hand on
# GitHub after a look; only then does the app's "new version" notice see it.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Testes sem TeX (${{ matrix.os }})
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: git config --global user.name "TeXugo CI" && git config --global user.email "ci@example.invalid"
      - run: npm ci
      - run: npm run build:web
      - run: npm run test:notex

  build:
    name: Instalador (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac
          - os: windows-latest
            args: --win
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The tag must match package.json, or the files and the notice disagree.
      - name: Versão
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm run dist -- ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: out/dist/*
          if-no-files-found: error

  release:
    name: Rascunho da release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Criar o rascunho com os instaladores
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" installers/* --repo "$GITHUB_REPOSITORY" --draft --title "TeXugo ${GITHUB_REF_NAME#v}" --notes "Instaladores para Mac (Apple Silicon e Intel), Windows e Linux. Windows e Linux são experimentais."
