# The Electron smoke script (test/ui/smoke.mjs) on the three systems: opens
# a project, edits, renames, conflicts, commit, switching project, closing
# and quitting with unsaved tabs. Without TeX it skips the compile checks.
name: Fumaça

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Fumaça no Electron (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: git config --global user.name "TeXugo CI" && git config --global user.email "ci@example.invalid"
      - run: npm ci
      - name: Fumaça (Linux, com tela virtual)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1
          npm run build:web
          xvfb-run -a npx electron --no-sandbox test/ui/smoke.mjs
      - name: Fumaça
        if: runner.os != 'Linux'
        run: npm run test:ui
