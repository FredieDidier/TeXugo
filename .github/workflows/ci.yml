# Unit tests on the three systems (without TeX), and every test, the ones
# that compile included, on Linux with TeX Live.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Testes sem TeX (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: git config --global user.name "TeXugo CI" && git config --global user.email "ci@example.invalid"
      - run: npm ci
      - run: npm run build:web
      - run: npm run test:notex
      - name: npm audit (aviso)
        run: npm audit --omit=dev
        continue-on-error: true

  tex:
    name: Todos os testes, com TeX Live (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $(grep -v '^#' .github/tl-packages.txt | xargs)
      - run: git config --global user.name "TeXugo CI" && git config --global user.email "ci@example.invalid"
      - run: npm ci
      - run: npm run build:web
      # Here a missing TeX tool is a failure, not a skipped test.
      - run: npm test
        env:
          TEXUGO_NEED_TEX: '1'
